[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fitting"
version = "0.1.0"
description = "A generalized and JAX/Optimistix accelerated curve fitting package"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "jax>=0.4",
    "jaxlib>=0.4",
    "optimistix>=0.1",
    "numpy>=2.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "tox",
    "mypy",
    "pylint",
    "black",
    "isort",
    "pandas-stubs",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.tox]
env_list = ["py312", "mypy", "pylint", "black", "isort"]

[tool.tox.env.py312]
description = "run unit tests"
deps = [
    "pytest",
]
commands = [
    ["pytest", { replace = "posargs", default = ["tests"], extend = true }],
]

[tool.tox.env.mypy]
description = "run type checks"
deps = [
    "mypy",
    "pandas-stubs",
    "types-setuptools",
]
commands = [
    ["mypy", { replace = "posargs", default = ["src", "tests", "examples"], extend = true }],
]

[tool.tox.env.pylint]
description = "run linters"
deps = [
    "pylint",
    "pytest",
]
commands = [
    ["pylint", { replace = "posargs", default = ["src", "tests", "examples"], extend = true }],
]

[tool.tox.env.black]
description = "run code formatters"
skip_install = true
deps = [
    "black",
]
commands = [
    ["black", { replace = "posargs", default = ["src", "tests", "examples"], extend = true }],
]

[tool.tox.env.isort]
description = "run import formatters"
skip_install = true
deps = [
    "isort",
]
commands = [
    ["isort", { replace = "posargs", default = ["src", "tests", "examples"], extend = true }],
]

[tool.isort]
profile = "black"
line_length = 79
skip_gitignore = true

[tool.black]
line-length = 79
target-version = ['py312']
skip_magic_trailing_comma = true

[tool.mypy]
ignore_missing_imports = true
strict = true
warn_unreachable = true
enable_error_code = [
    "explicit-override",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "ignore-without-code",
    "redundant-self",
]

[tool.pylint.main]
jobs = 0

[tool.pylint.basic]
variable-rgx = "^[a-z][a-zA-Z0-9_]*$"

[tool.pylint.format]
ignore-long-lines = "(?x)(\n\\#\\ type:\\ ignore)"
max-line-length = 79

[tool.pylint."messages control"]
disable = [
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-locals",
    "too-many-statements",
]
enable = [
    "deprecated-pragma",
    "useless-suppression",
    "use-symbolic-message-instead",
    "bad-inline-option",
]
